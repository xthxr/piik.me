name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Server Smoke Test
        run: |
          npm start &
          sleep 10
          curl -f http://localhost:3000 || exit 1
